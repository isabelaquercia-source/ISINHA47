name: Deploy Body Lab
on:
  push:
    branches: [main]
    paths:
      - "body-lab/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp body-lab/completo.html _site/index.html
          cp body-lab/completo.html _site/completo.html
          cp body-lab/index.html body-lab/styles.css body-lab/app.js body-lab/bodies.js body-lab/motion.js _site/ 2>/dev/null || true
          # multi-file lab folder
          mkdir -p _site/lab
          cp body-lab/* _site/lab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

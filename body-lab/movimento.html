<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Body Lab · Movimento</title>
<style>
  :root {
    --bg: #f4f5f7;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --card: #fff;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .85rem 1rem;
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .top a {
    text-decoration: none;
    color: var(--ink);
    padding: .4rem .7rem;
    border-radius: .55rem;
    background: #f1f5f9;
    font-size: .85rem;
  }
  .top strong { display: block; font-size: .95rem; }
  .top small { color: var(--muted); font-size: .72rem; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 1rem 1rem 2rem; }

  .corpo-root { display: grid; gap: .85rem; }
  .corpo-lead {
    margin: 0;
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.4;
  }
  .corpo-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .45rem;
  }
  .corpo-actions button {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: .75rem;
    padding: .7rem .65rem;
    font: inherit;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .corpo-actions button.on {
    background: #0f172a;
    color: #fff;
    border-color: #0f172a;
  }
  .corpo-stage {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 1.1rem;
    min-height: 52vh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .corpo-svg-wrap { width: 100%; }
  .corpo-svg { width: 100%; height: auto; display: block; max-height: 58vh; }
  .corpo-overlay {
    position: absolute;
    top: .85rem;
    right: 1rem;
    text-align: right;
    pointer-events: none;
  }
  .corpo-overlay strong {
    display: block;
    color: #ea580c;
    font-size: 1.6rem;
    letter-spacing: .02em;
  }
  .corpo-overlay span { color: var(--muted); font-size: .85rem; }
  .corpo-tip { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.4; }
  .corpo-readout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .55rem;
  }
  .corpo-readout > div {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: .85rem;
    padding: .75rem .85rem;
  }
  .corpo-readout span {
    display: block;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .corpo-readout b { font-size: 1.15rem; }
  .corpo-controls {
    display: grid;
    gap: .55rem;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: .95rem;
    padding: .85rem;
  }
  .corpo-controls button {
    justify-self: start;
    border: 0;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 700;
    padding: .55rem 1rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .corpo-controls label {
    display: grid;
    gap: .25rem;
    font-size: .8rem;
    color: var(--muted);
  }
  .corpo-controls input[type="range"] { width: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .corpo-controls button { opacity: .7; }
  }
</style>
</head>
<body>
  <header class="top">
    <a href="./mobile.html">← Hub</a>
    <div style="text-align:center">
      <strong>Movimento do corpo</strong>
      <small>consulta · músculo · ação</small>
    </div>
    <a href="./index.html">Protos</a>
  </header>
  <main class="wrap">
    <div id="mount"></div>
  </main>
  <script src="./corpo-engine.js"></script>
  <script>
    CorpoEngine.create(document.getElementById("mount"));
  </script>
</body>
</html>

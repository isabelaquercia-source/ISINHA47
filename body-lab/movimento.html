<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Body Lab · Boneco</title>
<style>
  :root {
    --bg: #0a0c0b;
    --ink: #f4f4f0;
    --muted: #8b958e;
    --line: #1e2622;
    --accent: #c8f542;
    --card: #121614;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .85rem 1rem;
    background: rgba(10,12,11,.92);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(8px);
  }
  .top a {
    text-decoration: none;
    color: var(--ink);
    padding: .4rem .7rem;
    border-radius: .55rem;
    background: #161b18;
    font-size: .85rem;
  }
  .top strong { display: block; font-size: .95rem; }
  .top small { color: var(--muted); font-size: .72rem; }
  .wrap { max-width: 520px; margin: 0 auto; padding: .75rem 1rem 2rem; }

  .corpo-root { display: grid; gap: .75rem; }
  .corpo-stage {
    position: relative;
    background: #070908;
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    min-height: 72vh;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .corpo-svg-wrap { width: 100%; }
  .corpo-svg { width: 100%; height: auto; display: block; max-height: 78vh; }
  .corpo-overlay {
    position: absolute;
    top: .9rem;
    right: 1rem;
    text-align: right;
    pointer-events: none;
  }
  .corpo-overlay strong {
    display: block;
    color: var(--accent);
    font-size: 1.55rem;
    letter-spacing: .04em;
  }
  .corpo-overlay span { color: var(--muted); font-size: .82rem; }
  .corpo-tip {
    margin: 0;
    color: var(--muted);
    font-size: .92rem;
    line-height: 1.4;
    text-align: center;
  }
  .corpo-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .4rem;
  }
  .corpo-actions button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: .75rem;
    padding: .65rem .55rem;
    font: inherit;
    font-size: .84rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--ink);
  }
  .corpo-actions button.on {
    background: var(--accent);
    color: #0a0c0b;
    border-color: var(--accent);
  }
  .corpo-controls {
    display: grid;
    gap: .5rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: .95rem;
    padding: .85rem;
  }
  .corpo-controls button {
    justify-self: start;
    border: 0;
    background: var(--accent);
    color: #0a0c0b;
    font: inherit;
    font-weight: 700;
    padding: .55rem 1rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .corpo-controls label {
    display: grid;
    gap: .25rem;
    font-size: .78rem;
    color: var(--muted);
  }
  .corpo-controls input[type="range"] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
  <header class="top">
    <a href="./lab.html">← Lab</a>
    <div style="text-align:center">
      <strong>Boneco</strong>
      <small>figura · movimento</small>
    </div>
    <a href="./perfect.html">Forma</a>
  </header>
  <main class="wrap">
    <div id="mount"></div>
  </main>
  <script src="./corpo-engine.js"></script>
  <script>
    CorpoEngine.create(document.getElementById("mount"));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Lab · 10 protótipos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --font-sans: "DM Sans", system-ui, sans-serif;
  --font-display: "Syne", sans-serif;
  --font-serif: "DM Serif Display", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-poster: "Bebas Neue", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #0a0a0b;
  color: #f2f0ea;
  font-family: var(--font-sans);
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
}

#app {
  min-height: 100vh;
}

.fig {
  width: 100%;
  height: auto;
  max-height: 70vh;
  display: block;
}

.fig-wide {
  max-height: 40vh;
}

/* ——— HUB ——— */
.hub {
  min-height: 100vh;
  padding: 2rem clamp(1rem, 3vw, 2.5rem) 3rem;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, #2a2418 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 0%, #1a2228 0%, transparent 50%),
    #0a0a0b;
}

.hub-head {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 2rem;
}

.hub-brand {
  display: flex;
  gap: 0.85rem;
  align-items: center;
}

.hub-mark {
  width: 2.6rem;
  height: 2.6rem;
  display: grid;
  place-items: center;
  border-radius: 0.6rem;
  background: linear-gradient(145deg, #e8d5a8, #a67c52);
  color: #1a1208;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.2rem;
}

.hub-brand strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.35rem;
  letter-spacing: -0.02em;
}

.hub-brand p,
.hub-hint {
  margin: 0.15rem 0 0;
  color: #9a958c;
  font-size: 0.9rem;
}

.hub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.9rem;
}

.hub-card {
  text-align: left;
  padding: 1.15rem 1.2rem 1.25rem;
  border-radius: 1rem;
  border: 1px solid color-mix(in srgb, var(--tone) 40%, #ffffff22);
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--tone) 88%, #fff) 0%, var(--tone) 100%);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  animation: cardIn 0.5s ease both;
}

.hub-card:nth-child(1) { animation-delay: 0.02s; }
.hub-card:nth-child(2) { animation-delay: 0.05s; }
.hub-card:nth-child(3) { animation-delay: 0.08s; }
.hub-card:nth-child(4) { animation-delay: 0.11s; }
.hub-card:nth-child(5) { animation-delay: 0.14s; }
.hub-card:nth-child(6) { animation-delay: 0.17s; }
.hub-card:nth-child(7) { animation-delay: 0.2s; }
.hub-card:nth-child(8) { animation-delay: 0.23s; }
.hub-card:nth-child(9) { animation-delay: 0.26s; }
.hub-card:nth-child(10) { animation-delay: 0.29s; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

.hub-card:hover {
  transform: translateY(-4px);
  border-color: #ffffff55;
  box-shadow: 0 18px 40px #00000066;
}

.hub-num {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  opacity: 0.55;
}

.hub-mode {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.7;
}

.hub-card h2 {
  margin: 0.2rem 0 0;
  font-family: var(--font-display);
  font-size: 1.55rem;
  letter-spacing: -0.03em;
}

.hub-card p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.4;
  opacity: 0.78;
  flex: 1;
}

.hub-fig {
  margin-top: 0.6rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  opacity: 0.55;
}

.hub-card-light {
  background:
    linear-gradient(160deg, #f4f1ec 0%, #e8e0d4 100%);
  color: #1c1917;
  border-color: #1c191733;
}

.hub-card-light .hub-num,
.hub-card-light .hub-mode,
.hub-card-light .hub-fig,
.hub-card-light p {
  opacity: 0.72;
  color: #3d3830;
}

/* ——— SHELL ——— */
.proto-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.proto-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.65rem 1rem;
  background: #0d0d0f;
  border-bottom: 1px solid #ffffff14;
  position: sticky;
  top: 0;
  z-index: 20;
}

.bar-mid {
  text-align: center;
}

.bar-mid strong {
  display: block;
  font-family: var(--font-display);
  font-size: 0.95rem;
}

.bar-mid span {
  font-size: 0.72rem;
  color: #8f8a82;
}

.bar-btn {
  padding: 0.4rem 0.75rem;
  border-radius: 0.5rem;
  background: #ffffff10;
  font-size: 0.85rem;
}

.bar-btn:hover {
  background: #ffffff1c;
}

.bar-nav {
  display: flex;
  gap: 0.35rem;
}

.bar-nav .bar-btn {
  width: 2.2rem;
  font-size: 1.2rem;
  line-height: 1;
}

.proto-stage {
  flex: 1;
}

/* ——— 01 FORMA ——— */
.forma {
  position: relative;
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  align-items: end;
  overflow: hidden;
  background: #0c0f0a;
  color: #e7e2d6;
}

.forma-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 70% 40%, #1d2a12 0%, transparent 60%),
    linear-gradient(180deg, #12160e, #0c0f0a 70%);
  animation: pulseGlow 6s ease-in-out infinite alternate;
}

@keyframes pulseGlow {
  from { filter: brightness(1); }
  to { filter: brightness(1.12); }
}

.forma-copy,
.forma-body {
  position: relative;
  z-index: 1;
  padding: clamp(1.5rem, 4vw, 3.5rem);
}

.forma-brand {
  margin: 0;
  font-family: var(--font-poster);
  font-size: clamp(4rem, 12vw, 8rem);
  letter-spacing: 0.04em;
  line-height: 0.85;
  color: #c8f542;
  animation: brandRise 0.8s ease both;
}

@keyframes brandRise {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}

.forma h1 {
  margin: 0.4rem 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 4vw, 3.2rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
}

.forma-sub {
  max-width: 28ch;
  color: #a8a496;
  line-height: 1.45;
}

.forma-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin-top: 1.5rem;
}

.forma-go {
  padding: 0.85rem 1.4rem;
  background: #c8f542;
  color: #101408;
  font-weight: 700;
  border-radius: 999px;
}

.forma-cta span {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: #8e9480;
}

.forma-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
}

.forma-body .fig {
  max-height: 62vh;
  animation: floatY 4s ease-in-out infinite;
}

@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.forma-meter {
  width: min(220px, 50%);
  height: 4px;
  margin-top: 1rem;
  background: #ffffff18;
  border-radius: 99px;
  overflow: hidden;
}

.forma-meter span {
  display: block;
  height: 100%;
  width: 62%;
  background: #c8f542;
  animation: meter 2.4s ease-in-out infinite alternate;
}

@keyframes meter {
  from { width: 35%; }
  to { width: 78%; }
}

/* ——— 02 ATLAS ——— */
.atlas {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: minmax(240px, 0.9fr) 1.2fr;
  background:
    linear-gradient(135deg, #f7f3ec 0%, #ebe4d8 50%, #e2d9cb 100%);
  color: #1c1917;
}

.atlas-side {
  padding: clamp(1.5rem, 3vw, 2.5rem);
  border-right: 1px solid #1c191722;
}

.atlas-kicker {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #7a7066;
}

.atlas h1 {
  margin: 0.5rem 0 1.5rem;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2.4rem, 4vw, 3.6rem);
  line-height: 1.05;
}

.atlas-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.4rem;
}

.atlas-list button {
  width: 100%;
  text-align: left;
  padding: 0.7rem 0.85rem;
  border-radius: 0.4rem;
  border: 1px solid transparent;
  font-weight: 500;
}

.atlas-list button:hover,
.atlas-list button.on {
  background: #1c1917;
  color: #f4f1ec;
}

.atlas-note {
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid #1c191722;
}

.atlas-note h3 {
  margin: 0 0 0.4rem;
  font-family: var(--font-serif);
  font-size: 1.25rem;
}

.atlas-note p {
  margin: 0;
  color: #5c534a;
  line-height: 1.45;
}

.atlas-stage {
  position: relative;
  display: grid;
  place-items: center;
  padding: 2rem;
}

.atlas-stage .fig {
  max-height: 72vh;
}

.atlas-tags span {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  padding: 0.25rem 0.55rem;
  border-radius: 0.3rem;
  background: #ffffffcc;
  border: 1px solid #1c191733;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  opacity: 0.45;
  transition: opacity 0.2s, background 0.2s;
}

.atlas-tags span.on {
  opacity: 1;
  background: #c45c3e;
  color: #fff;
  border-color: transparent;
}

/* ——— 03 LINK ——— */
.link {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1.3fr 0.9fr;
  background: #101820;
  color: #e4eef5;
}

.link-live {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 0.75rem;
  padding: 1rem;
}

.link-cam {
  position: relative;
  border-radius: 1rem;
  overflow: hidden;
  background:
    radial-gradient(circle at 40% 30%, #1e3a4f, #0c141c 70%);
  display: grid;
  place-items: center;
  min-height: 50vh;
}

.link-dot {
  position: absolute;
  top: 1rem;
  left: 1rem;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: #ff4d4d;
  box-shadow: 0 0 0 0 #ff4d4d88;
  animation: livePulse 1.6s infinite;
}

@keyframes livePulse {
  0% { box-shadow: 0 0 0 0 #ff4d4d66; }
  70% { box-shadow: 0 0 0 12px #ff4d4d00; }
  100% { box-shadow: 0 0 0 0 #ff4d4d00; }
}

.link-cam > p {
  position: absolute;
  top: 0.85rem;
  left: 2rem;
  margin: 0;
  font-size: 0.8rem;
  color: #9eb6c8;
}

.link-cam-body {
  width: min(280px, 55%);
  opacity: 0.85;
}

.link-coach {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 0.85rem;
  border-radius: 0.85rem;
  background: #182430;
}

.link-coach-face {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 0.55rem;
  background: linear-gradient(145deg, #5ec8ff, #2a6f8f);
}

.link-coach p {
  margin: 0;
  font-size: 0.9rem;
}

.link-panel {
  padding: 1.5rem 1.25rem;
  border-left: 1px solid #ffffff12;
  background: #0c1218;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.link-brand {
  margin: 0;
  font-family: var(--font-mono);
  letter-spacing: 0.2em;
  font-size: 0.75rem;
  color: #5ec8ff;
}

.link-panel h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.8rem;
  letter-spacing: -0.02em;
}

.link-panel > p {
  margin: 0;
  color: #8aa0b2;
  font-size: 0.92rem;
  line-height: 1.4;
}

.link-ref {
  width: 70%;
  margin: 0.5rem auto;
}

.link-notes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.4rem;
  font-size: 0.88rem;
}

.link-notes .ok::before {
  content: "✓ ";
  color: #5dcf8a;
}

.link-notes .warn::before {
  content: "! ";
  color: #f0c14a;
}

.link-btn {
  margin-top: auto;
  padding: 0.8rem 1rem;
  border-radius: 0.6rem;
  background: #5ec8ff;
  color: #041018;
  font-weight: 700;
}

/* ——— 04 ACERVO ——— */
.acervo {
  min-height: calc(100vh - 52px);
  padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2.5rem;
  background:
    linear-gradient(180deg, #221e18, #1c1915 40%, #16130f);
  color: #f0e6d8;
}

.acervo-head {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 1.5rem;
}

.acervo-head p {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #a89070;
}

.acervo-head h1 {
  margin: 0.3rem 0 0;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
}

.acervo-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.acervo-filters button {
  padding: 0.4rem 0.75rem;
  border-radius: 0.4rem;
  border: 1px solid #ffffff22;
  font-size: 0.8rem;
  text-transform: capitalize;
}

.acervo-filters button.on {
  background: #d4a574;
  color: #1c140c;
  border-color: transparent;
}

.acervo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.85rem;
}

.acervo-item {
  padding: 1rem 0.85rem 1.1rem;
  border-radius: 0.75rem;
  background: #2a241c;
  border: 1px solid #ffffff10;
  transition: transform 0.2s ease;
}

.acervo-item:hover {
  transform: translateY(-3px);
}

.acervo-thumb {
  height: 140px;
  display: grid;
  place-items: center;
  margin-bottom: 0.6rem;
}

.acervo-thumb .fig {
  max-height: 130px;
}

.acervo-item h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.05rem;
}

.acervo-item p {
  margin: 0.2rem 0 0;
  font-size: 0.78rem;
  color: #a89070;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ——— 05 ESTÚDIO ——— */
.estudio {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  background:
    radial-gradient(ellipse at 80% 20%, #1a3a55 0%, transparent 45%),
    linear-gradient(160deg, #0b1c2c, #07131e);
  color: #f3efe6;
}

.estudio-left,
.estudio-right {
  padding: clamp(1.5rem, 4vw, 3.5rem);
}

.estudio-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid #ffffff14;
}

.estudio-issue {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #e2b857;
}

.estudio h1 {
  margin: 0.8rem 0;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2.6rem, 5vw, 4.2rem);
  line-height: 1.05;
}

.estudio h1 em {
  font-style: italic;
  color: #e2b857;
}

.estudio-lead {
  max-width: 34ch;
  color: #b7c0c9;
  line-height: 1.5;
  font-size: 1.05rem;
}

.estudio-meta {
  display: flex;
  gap: 1.5rem;
  margin-top: 2rem;
}

.estudio-meta dt {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #7f8b96;
}

.estudio-meta dd {
  margin: 0.2rem 0 0;
  font-family: var(--font-serif);
  font-size: 1.8rem;
}

.estudio-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.estudio-right .fig {
  max-height: 65vh;
  animation: fadeUp 0.9s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

.estudio-cap {
  margin-top: 1rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #7f8b96;
}

/* ——— 06 ROLO ——— */
.rolo {
  min-height: calc(100vh - 52px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: clamp(1.5rem, 4vw, 3rem);
  padding: 1.5rem clamp(1rem, 4vw, 3rem);
  background: #090909;
  color: #f5f5f5;
}

.rolo-phone {
  width: min(320px, 90vw);
  aspect-ratio: 9 / 16;
  border-radius: 1.6rem;
  border: 1px solid #ffffff22;
  background: #111;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px #000000aa;
}

.rolo-slide {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 1.2rem;
  background:
    radial-gradient(ellipse at 50% 30%, #2a1a14, #0a0a0a 70%);
}

.rolo-slide .fig {
  position: absolute;
  inset: 8% 10% 28%;
  max-height: none;
  height: auto;
  margin: auto;
}

.rolo-meta {
  position: relative;
  z-index: 2;
}

.rolo-meta h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.6rem;
}

.rolo-meta p {
  margin: 0.25rem 0 0.8rem;
  color: #b0b0b0;
  font-size: 0.9rem;
}

.rolo-meta button {
  padding: 0.65rem 1rem;
  border-radius: 999px;
  background: #ff7a59;
  color: #1a0804;
  font-weight: 700;
  font-size: 0.85rem;
}

.rolo-rail {
  position: absolute;
  right: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  display: grid;
  gap: 0.35rem;
}

.rolo-rail span {
  width: 0.35rem;
  height: 0.35rem;
  border-radius: 50%;
  background: #ffffff33;
}

.rolo-rail span.on {
  background: #ff7a59;
  height: 1.1rem;
  border-radius: 99px;
}

.rolo-aside {
  max-width: 28ch;
}

.rolo-brand {
  margin: 0;
  font-family: var(--font-poster);
  font-size: 4rem;
  letter-spacing: 0.06em;
  line-height: 0.9;
  color: #ff7a59;
}

.rolo-aside h1 {
  margin: 0.5rem 0;
  font-family: var(--font-display);
  font-size: 2rem;
}

.rolo-aside p {
  color: #9a9a9a;
  line-height: 1.45;
}

/* ——— 07 TRAÇO ——— */
.traco {
  min-height: calc(100vh - 52px);
  padding: 1.25rem clamp(1rem, 3vw, 2rem) 2rem;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 19px,
      #0a304022 19px,
      #0a304022 20px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 19px,
      #0a304022 19px,
      #0a304022 20px
    ),
    #041018;
  color: #9fe9ff;
  font-family: var(--font-mono);
}

.traco-head p {
  margin: 0;
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  opacity: 0.7;
}

.traco-head h1 {
  margin: 0.4rem 0 1.2rem;
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: clamp(1.2rem, 2.5vw, 1.7rem);
  letter-spacing: 0.04em;
}

.traco-board {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 0.75rem;
  min-height: 60vh;
}

.traco-panel {
  border: 1px solid #3dd6ff44;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  background: #061820aa;
}

.traco-panel span {
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  margin-bottom: 0.5rem;
}

.traco-panel .fig {
  flex: 1;
  max-height: 55vh;
}

.traco-spec {
  border: 1px dashed #3dd6ff66;
  padding: 1rem;
  background: #031018;
}

.traco-spec h3 {
  margin: 0 0 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  font-size: 0.85rem;
}

.traco-spec ul {
  margin: 0;
  padding-left: 1.1rem;
  display: grid;
  gap: 0.55rem;
  font-size: 0.82rem;
  line-height: 1.35;
  color: #7fdfff;
}

.traco-code {
  margin-top: 1.5rem;
  font-size: 0.72rem;
  opacity: 0.65;
}

/* ——— 08 ESPELHO ——— */
.espelho {
  min-height: calc(100vh - 52px);
  padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2rem;
  background:
    linear-gradient(180deg, #1a1714, #141210);
  color: #e8dfd4;
  text-align: center;
}

.espelho-title {
  margin: 0 0 1.25rem;
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  letter-spacing: -0.02em;
}

.espelho-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  max-width: 960px;
  margin: 0 auto;
}

.espelho-pane {
  padding: 1rem 1rem 1.2rem;
  border-radius: 1rem;
  background: #1f1b17;
  border: 1px solid #ffffff12;
  text-align: left;
}

.espelho-pane > p {
  margin: 0 0 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.espelho-pane.bad > p { color: #e85d4c; }
.espelho-pane.good > p { color: #5dcf8a; }

.espelho-pane .fig {
  max-height: 42vh;
  margin: 0 auto;
}

.espelho-pane ul {
  margin: 0.75rem 0 0;
  padding-left: 1.1rem;
  color: #b4a99a;
  font-size: 0.9rem;
  line-height: 1.45;
}

.espelho-btn {
  margin-top: 1.5rem;
  padding: 0.8rem 1.4rem;
  border-radius: 999px;
  background: #e8dfd4;
  color: #141210;
  font-weight: 700;
}

/* ——— 09 ÓRBITA ——— */
.orbita {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  align-items: center;
  gap: 1rem;
  padding: 1.5rem;
  background:
    radial-gradient(circle at 35% 50%, #1a1830 0%, #0e0e12 55%);
  color: #eceaf5;
}

.orbita-ring {
  position: relative;
  width: min(420px, 85vw);
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 50%;
  border: 1px dashed #ffffff28;
  display: grid;
  place-items: center;
}

.orbita-core {
  width: 55%;
}

.orbita-node {
  position: absolute;
  left: 50%;
  top: 50%;
  transform:
    rotate(var(--a)) translate(0, calc(-1 * min(195px, 38vw))) rotate(calc(-1 * var(--a)));
  padding: 0.5rem 0.75rem;
  border-radius: 999px;
  background: #1c1a28;
  border: 1px solid #ffffff22;
  font-size: 0.8rem;
  white-space: nowrap;
}

.orbita-node.on {
  background: #a78bfa;
  color: #120f1c;
  border-color: transparent;
  font-weight: 700;
}

.orbita-info {
  max-width: 32ch;
}

.orbita-info p:first-child {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #a78bfa;
}

.orbita-info h1 {
  margin: 0.4rem 0;
  font-family: var(--font-display);
  font-size: 2.4rem;
  letter-spacing: -0.03em;
}

.orbita-info p:last-child {
  color: #9b97ab;
  line-height: 1.45;
}

/* ——— 10 GIZ ——— */
.giz {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  background: #0f141c;
  color: #f5e6c8;
}

.giz-board {
  margin: 1rem;
  padding: 1.25rem clamp(1rem, 3vw, 2rem);
  border-radius: 0.4rem;
  background:
    radial-gradient(ellipse at 30% 20%, #243044, transparent 50%),
    #1a2330;
  border: 1px solid #ffffff10;
  box-shadow: inset 0 0 80px #00000055;
  position: relative;
}

.giz-board header p {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  opacity: 0.65;
}

.giz-board h1 {
  margin: 0.35rem 0 1rem;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.6rem, 3vw, 2.2rem);
}

.giz-body {
  position: relative;
  max-width: 280px;
  margin: 0 auto;
}

.giz-marks {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.giz-notes {
  list-style: none;
  margin: 1.25rem 0 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  font-family: var(--font-mono);
  font-size: 0.85rem;
}

.giz-side {
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-left: 1px solid #ffffff10;
}

.giz-brand {
  margin: 0;
  font-family: var(--font-poster);
  font-size: 4.5rem;
  letter-spacing: 0.08em;
  line-height: 0.85;
  opacity: 0.9;
}

.giz-side h2 {
  margin: 0.6rem 0;
  font-family: var(--font-display);
  font-size: 1.5rem;
}

.giz-side p {
  color: #b8a888;
  line-height: 1.45;
}

.giz-side button {
  margin-top: 1.25rem;
  align-self: start;
  padding: 0.7rem 1.1rem;

function shell(id, inner) {
  const p = PROTOS.find((x) => x.id === id);
  const idx = PROTOS.findIndex((x) => x.id === id);
  return `
  <div class="proto-shell proto-${id}">
    <header class="proto-bar">
      <button type="button" class="bar-btn" data-hub>← Hub</button>
      <div class="bar-mid">
        <strong>${p.name}</strong>
        <span>${modeLabel(p.mode)} · ${idx + 1}/10</span>
      </div>
      <div class="bar-nav">
        <button type="button" class="bar-btn" data-prev aria-label="Anterior">‹</button>
        <button type="button" class="bar-btn" data-next aria-label="Próximo">›</button>

const RENDERERS = {
  forma: renderForma,
  atlas: renderAtlas,
  link: renderLink,
  acervo: renderAcervo,
  estudio: renderEstudio,
  rolo: renderRolo,
  traco: renderTraco,
  espelho: renderEspelho,
  orbita: renderOrbita,
  giz: renderGiz,
};

function render() {
  app.innerHTML = state.view === "hub" ? renderHub() : RENDERERS[state.proto]();
  wire();
}

function wire() {
  app.querySelectorAll("[data-open]").forEach((el) =>
    el.addEventListener("click", () => openProto(el.dataset.open)),
  );
  app.querySelectorAll("[data-hub]").forEach((el) => el.addEventListener("click", goHub));
  app.querySelectorAll("[data-prev]").forEach((el) =>
    el.addEventListener("click", () => shiftProto(-1)),
  );
  app.querySelectorAll("[data-next]").forEach((el) =>
    el.addEventListener("click", () => shiftProto(1)),
  );
  app.querySelectorAll("[data-atlas]").forEach((el) =>
    el.addEventListener("click", () => {
      state.atlasFocus = el.dataset.atlas;
      render();
    }),
  );
  app.querySelectorAll("[data-acervo]").forEach((el) =>
    el.addEventListener("click", () => {
      state.acervoFilter = el.dataset.acervo;
      render();
    }),
  );
  app.querySelectorAll("[data-orbita]").forEach((el) =>
    el.addEventListener("click", () => {
      state.orbita = el.dataset.orbita;
      render();
    }),
  );
}

document.addEventListener("keydown", (e) => {
  if (state.view !== "proto") return;
  if (e.key === "ArrowLeft") shiftProto(-1);
  if (e.key === "ArrowRight") shiftProto(1);
  if (e.key === "Escape") goHub();
});

render();

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Lab · motion max</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>:root {
  --font-sans: "DM Sans", system-ui, sans-serif;
  --font-display: "Syne", sans-serif;
  --font-serif: "DM Serif Display", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --font-poster: "Bebas Neue", sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #0a0a0b;
  color: #f2f0ea;
  font-family: var(--font-sans);
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
}

#app {
  min-height: 100vh;
}

.fig {
  width: 100%;
  height: auto;
  max-height: 70vh;
  display: block;
}

.fig-wide {
  max-height: 40vh;
}

/* ——— HUB ——— */
.hub {
  min-height: 100vh;
  padding: 2rem clamp(1rem, 3vw, 2.5rem) 3rem;
  background:
    radial-gradient(ellipse 80% 50% at 10% -10%, #2a2418 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 0%, #1a2228 0%, transparent 50%),
    #0a0a0b;
}

.hub-head {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 2rem;
}

.hub-brand {
  display: flex;
  gap: 0.85rem;
  align-items: center;
}

.hub-mark {
  width: 2.6rem;
  height: 2.6rem;
  display: grid;
  place-items: center;
  border-radius: 0.6rem;
  background: linear-gradient(145deg, #e8d5a8, #a67c52);
  color: #1a1208;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.2rem;
}

.hub-brand strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.35rem;
  letter-spacing: -0.02em;
}

.hub-brand p,
.hub-hint {
  margin: 0.15rem 0 0;
  color: #9a958c;
  font-size: 0.9rem;
}

.hub-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.9rem;
}

.hub-card {
  text-align: left;
  padding: 1.15rem 1.2rem 1.25rem;
  border-radius: 1rem;
  border: 1px solid color-mix(in srgb, var(--tone) 40%, #ffffff22);
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--tone) 88%, #fff) 0%, var(--tone) 100%);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  animation: cardIn 0.5s ease both;
}

.hub-card:nth-child(1) { animation-delay: 0.02s; }
.hub-card:nth-child(2) { animation-delay: 0.05s; }
.hub-card:nth-child(3) { animation-delay: 0.08s; }
.hub-card:nth-child(4) { animation-delay: 0.11s; }
.hub-card:nth-child(5) { animation-delay: 0.14s; }
.hub-card:nth-child(6) { animation-delay: 0.17s; }
.hub-card:nth-child(7) { animation-delay: 0.2s; }
.hub-card:nth-child(8) { animation-delay: 0.23s; }
.hub-card:nth-child(9) { animation-delay: 0.26s; }
.hub-card:nth-child(10) { animation-delay: 0.29s; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

.hub-card:hover {
  transform: translateY(-4px);
  border-color: #ffffff55;
  box-shadow: 0 18px 40px #00000066;
}

.hub-num {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  opacity: 0.55;
}

.hub-mode {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.7;
}

.hub-card h2 {
  margin: 0.2rem 0 0;
  font-family: var(--font-display);
  font-size: 1.55rem;
  letter-spacing: -0.03em;
}

.hub-card p {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.4;
  opacity: 0.78;
  flex: 1;
}

.hub-fig {
  margin-top: 0.6rem;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  opacity: 0.55;
}

.hub-card-light {
  background:
    linear-gradient(160deg, #f4f1ec 0%, #e8e0d4 100%);
  color: #1c1917;
  border-color: #1c191733;
}

.hub-card-light .hub-num,
.hub-card-light .hub-mode,
.hub-card-light .hub-fig,
.hub-card-light p {
  opacity: 0.72;
  color: #3d3830;
}

/* ——— SHELL ——— */
.proto-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.proto-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.65rem 1rem;
  background: #0d0d0f;
  border-bottom: 1px solid #ffffff14;
  position: sticky;
  top: 0;
  z-index: 20;
}

.bar-mid {
  text-align: center;
}

.bar-mid strong {
  display: block;
  font-family: var(--font-display);
  font-size: 0.95rem;
}

.bar-mid span {
  font-size: 0.72rem;
  color: #8f8a82;
}

.bar-btn {
  padding: 0.4rem 0.75rem;
  border-radius: 0.5rem;
  background: #ffffff10;
  font-size: 0.85rem;
}

.bar-btn:hover {
  background: #ffffff1c;
}

.bar-nav {
  display: flex;
  gap: 0.35rem;
}

.bar-nav .bar-btn {
  width: 2.2rem;
  font-size: 1.2rem;
  line-height: 1;
}

.proto-stage {
  flex: 1;
}

/* ——— 01 FORMA ——— */
.forma {
  position: relative;
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  align-items: end;
  overflow: hidden;
  background: #0c0f0a;
  color: #e7e2d6;
}

.forma-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 60% at 70% 40%, #1d2a12 0%, transparent 60%),
    linear-gradient(180deg, #12160e, #0c0f0a 70%);
  animation: pulseGlow 6s ease-in-out infinite alternate;
}

@keyframes pulseGlow {
  from { filter: brightness(1); }
  to { filter: brightness(1.12); }
}

.forma-copy,
.forma-body {
  position: relative;
  z-index: 1;
  padding: clamp(1.5rem, 4vw, 3.5rem);
}

.forma-brand {
  margin: 0;
  font-family: var(--font-poster);
  font-size: clamp(4rem, 12vw, 8rem);
  letter-spacing: 0.04em;
  line-height: 0.85;
  color: #c8f542;
  animation: brandRise 0.8s ease both;
}

@keyframes brandRise {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: none; }
}

.forma h1 {
  margin: 0.4rem 0 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 4vw, 3.2rem);
  line-height: 1.05;
  letter-spacing: -0.03em;
}

.forma-sub {
  max-width: 28ch;
  color: #a8a496;
  line-height: 1.45;
}

.forma-cta {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin-top: 1.5rem;
}

.forma-go {
  padding: 0.85rem 1.4rem;
  background: #c8f542;
  color: #101408;
  font-weight: 700;
  border-radius: 999px;
}

.forma-cta span {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: #8e9480;
}

.forma-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
}

.forma-body .fig {
  max-height: 62vh;
}

.fig-athlete {
  overflow: visible;
}

.fig-athlete .b-root,
.fig-athlete .b-torso,
.fig-athlete .b-hip,
.fig-athlete .b-thigh-l,
.fig-athlete .b-thigh-r,
.fig-athlete .b-shin-l,
.fig-athlete .b-shin-r,
.fig-athlete .b-arm-l,
.fig-athlete .b-arm-r,
.fig-athlete .b-forearm-l,
.fig-athlete .b-forearm-r,
.fig-athlete .b-head {
  transform-box: fill-box;
  transform-origin: center top;
}

.fig-athlete .b-head {
  transform-origin: center bottom;
}

.fig-athlete .b-shadow {
  transform-origin: center center;
}

@media (prefers-reduced-motion: reduce) {
  .forma-meter span,
  .link-dot,
  .hub-card {
    animation: none !important;
  }
}

.forma-meter {
  width: min(220px, 50%);
  height: 4px;
  margin-top: 1rem;
  background: #ffffff18;
  border-radius: 99px;
  overflow: hidden;
}

.forma-meter span {
  display: block;
  height: 100%;
  width: 62%;
  background: #c8f542;
  animation: meter 2.4s ease-in-out infinite alternate;
}

@keyframes meter {
  from { width: 35%; }
  to { width: 78%; }
}

/* ——— 02 ATLAS ——— */
.atlas {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: minmax(240px, 0.9fr) 1.2fr;
  background:
    linear-gradient(135deg, #f7f3ec 0%, #ebe4d8 50%, #e2d9cb 100%);
  color: #1c1917;
}

.atlas-side {
  padding: clamp(1.5rem, 3vw, 2.5rem);
  border-right: 1px solid #1c191722;
}

.atlas-kicker {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #7a7066;
}

.atlas h1 {
  margin: 0.5rem 0 1.5rem;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2.4rem, 4vw, 3.6rem);
  line-height: 1.05;
}

.atlas-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.4rem;
}

.atlas-list button {
  width: 100%;
  text-align: left;
  padding: 0.7rem 0.85rem;
  border-radius: 0.4rem;
  border: 1px solid transparent;
  font-weight: 500;
}

.atlas-list button:hover,
.atlas-list button.on {
  background: #1c1917;
  color: #f4f1ec;
}

.atlas-note {
  margin-top: 1.5rem;
  padding-top: 1.2rem;
  border-top: 1px solid #1c191722;
}

.atlas-note h3 {
  margin: 0 0 0.4rem;
  font-family: var(--font-serif);
  font-size: 1.25rem;
}

.atlas-note p {
  margin: 0;
  color: #5c534a;
  line-height: 1.45;
}

.atlas-stage {
  position: relative;
  display: grid;
  place-items: center;
  padding: 2rem;
}

.atlas-stage .fig {
  max-height: 72vh;
}

.atlas-tags span {
  position: absolute;
  left: var(--x);
  top: var(--y);
  transform: translate(-50%, -50%);
  padding: 0.25rem 0.55rem;
  border-radius: 0.3rem;
  background: #ffffffcc;
  border: 1px solid #1c191733;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  opacity: 0.45;
  transition: opacity 0.2s, background 0.2s;
}

.atlas-tags span.on {
  opacity: 1;
  background: #c45c3e;
  color: #fff;
  border-color: transparent;
}

/* ——— 03 LINK ——— */
.link {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1.3fr 0.9fr;
  background: #101820;
  color: #e4eef5;
}

.link-live {
  display: grid;
  grid-template-rows: 1fr auto;
  gap: 0.75rem;
  padding: 1rem;
}

.link-cam {
  position: relative;
  border-radius: 1rem;
  overflow: hidden;
  background:
    radial-gradient(circle at 40% 30%, #1e3a4f, #0c141c 70%);
  display: grid;
  place-items: center;
  min-height: 50vh;
}

.link-dot {
  position: absolute;
  top: 1rem;
  left: 1rem;
  width: 0.55rem;
  height: 0.55rem;
  border-radius: 50%;
  background: #ff4d4d;
  box-shadow: 0 0 0 0 #ff4d4d88;
  animation: livePulse 1.6s infinite;
}

@keyframes livePulse {
  0% { box-shadow: 0 0 0 0 #ff4d4d66; }
  70% { box-shadow: 0 0 0 12px #ff4d4d00; }
  100% { box-shadow: 0 0 0 0 #ff4d4d00; }
}

.link-cam > p {
  position: absolute;
  top: 0.85rem;
  left: 2rem;
  margin: 0;
  font-size: 0.8rem;
  color: #9eb6c8;
}

.link-cam-body {
  width: min(280px, 55%);
  opacity: 0.85;
}

.link-coach {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 0.85rem;
  border-radius: 0.85rem;
  background: #182430;
}

.link-coach-face {
  width: 2.4rem;
  height: 2.4rem;
  border-radius: 0.55rem;
  background: linear-gradient(145deg, #5ec8ff, #2a6f8f);
}

.link-coach p {
  margin: 0;
  font-size: 0.9rem;
}

.link-panel {
  padding: 1.5rem 1.25rem;
  border-left: 1px solid #ffffff12;
  background: #0c1218;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.link-brand {
  margin: 0;
  font-family: var(--font-mono);
  letter-spacing: 0.2em;
  font-size: 0.75rem;
  color: #5ec8ff;
}

.link-panel h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.8rem;
  letter-spacing: -0.02em;
}

.link-panel > p {
  margin: 0;
  color: #8aa0b2;
  font-size: 0.92rem;
  line-height: 1.4;
}

.link-ref {
  width: 70%;
  margin: 0.5rem auto;
}

.link-notes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 0.4rem;
  font-size: 0.88rem;
}

.link-notes .ok::before {
  content: "✓ ";
  color: #5dcf8a;
}

.link-notes .warn::before {
  content: "! ";
  color: #f0c14a;
}

.link-btn {
  margin-top: auto;
  padding: 0.8rem 1rem;
  border-radius: 0.6rem;
  background: #5ec8ff;
  color: #041018;
  font-weight: 700;
}

/* ——— 04 ACERVO ——— */
.acervo {
  min-height: calc(100vh - 52px);
  padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2.5rem;
  background:
    linear-gradient(180deg, #221e18, #1c1915 40%, #16130f);
  color: #f0e6d8;
}

.acervo-head {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 1.5rem;
}

.acervo-head p {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #a89070;
}

.acervo-head h1 {
  margin: 0.3rem 0 0;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(1.8rem, 3vw, 2.6rem);
}

.acervo-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.acervo-filters button {
  padding: 0.4rem 0.75rem;
  border-radius: 0.4rem;
  border: 1px solid #ffffff22;
  font-size: 0.8rem;
  text-transform: capitalize;
}

.acervo-filters button.on {
  background: #d4a574;
  color: #1c140c;
  border-color: transparent;
}

.acervo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.85rem;
}

.acervo-item {
  padding: 1rem 0.85rem 1.1rem;
  border-radius: 0.75rem;
  background: #2a241c;
  border: 1px solid #ffffff10;
  transition: transform 0.2s ease;
}

.acervo-item:hover {
  transform: translateY(-3px);
}

.acervo-thumb {
  height: 140px;
  display: grid;
  place-items: center;
  margin-bottom: 0.6rem;
}

.acervo-thumb .fig {
  max-height: 130px;
}

.acervo-item h3 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.05rem;
}

.acervo-item p {
  margin: 0.2rem 0 0;
  font-size: 0.78rem;
  color: #a89070;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* ——— 05 ESTÚDIO ——— */
.estudio {
  min-height: calc(100vh - 52px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  background:
    radial-gradient(ellipse at 80% 20%, #1a3a55 0%, transparent 45%),
    linear-gradient(160deg, #0b1c2c, #07131e);
  color: #f3efe6;
}

.estudio-left,
.estudio-right {
  padding: clamp(1.5rem, 4vw, 3.5rem);
}

.estudio-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid #ffffff14;
}

.estudio-issue {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #e2b857;
}

.estudio h1 {
  margin: 0.8rem 0;
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2.6rem, 5vw, 4.2rem);
  line-height: 1.05;
}

.estudio h1 em {
  font-style: italic;
  color: #e2b857;
}

.estudio-lead {
  max-width: 34ch;
  color: #b7c0c9;
  line-height: 1.5;
  font-size: 1.05rem;
}

.estudio-meta {
  display: flex;
  gap: 1.5rem;
  margin-top: 2rem;
}

.estudio-meta dt {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #7f8b96;
}

.estudio-meta dd {
  margin: 0.2rem 0 0;
  font-family: var(--font-serif);
  font-size: 1.8rem;
}

.estudio-right {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.estudio-right .fig {
  max-height: 65vh;
  animation: fadeUp 0.9s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}

.estudio-cap {
  margin-top: 1rem;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: #7f8b96;
}

/* ——— 06 ROLO ——— */
.rolo {
  min-height: calc(100vh - 52px);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: clamp(1.5rem, 4vw, 3rem);
  padding: 1.5rem clamp(1rem, 4vw, 3rem);
  background: #090909;
  color: #f5f5f5;
}

.rolo-phone {
  width: min(320px, 90vw);
  aspect-ratio: 9 / 16;
  border-radius: 1.6rem;
  border: 1px solid #ffffff22;
  background: #111;
  overflow: hidden;
  position: relative;
  box-shadow: 0 30px 60px #000000aa;
}

.rolo-slide {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 1.2rem;
  background:
    radial-gradient(ellipse at 50% 30%, #2a1a14, #0a0a0a 70%);
}

.rolo-slide .fig {
  position: absolute;
  inset: 8% 10% 28%;
  max-height: none;
  height: auto;
  margin: auto;
}

.rolo-meta {
  position: relative;
  z-index: 2;
}

.rolo-meta h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.6rem;
}

.rolo-meta p {
  margin: 0.25rem 0 0.8rem;
  color: #b0b0b0;
  font-size: 0.9rem;
}

.rolo-meta button {
  padding: 0.65rem 1rem;
  border-radius: 999px;
  background: #ff7a59;
  color: #1a0804;
  font-weight: 700;
  font-size: 0.85rem;
}

.rolo-rail {
  position: absolute;
  right: 0.7rem;
  top: 50%;

  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 19px,
      #0a304022 19px,
      #0a304022 20px

    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 19px,
      #0a304022 19px,
      #0a304022 20px

  font-size: 0.75rem;

.traco-head h1 {

  font-weight: 500;

.traco-board {
  display: grid;
  grid-template-columns: 1fr 1fr 0.85fr;
  gap: 0.75rem;
  min-height: 60vh;
}

.traco-panel {
  border: 1px solid #3dd6ff44;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  background: #061820aa;
}

.traco-panel span {
  font-size: 0.7rem;
  letter-spacing: 0.16em;
  margin-bottom: 0.5rem;
}

.traco-panel .fig {

}

.traco-spec {
  border: 1px dashed #3dd6ff66;
  padding: 1rem;
  background: #031018;
}

.traco-spec h3 {
  margin: 0 0 0.8rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  font-size: 0.85rem;
}

.traco-spec ul {
  margin: 0;
  padding-left: 1.1rem;

  gap: 0.55rem;
  font-size: 0.82rem;
  line-height: 1.35;

.traco-code {
  margin-top: 1.5rem;

/* ——— 08 ESPELHO ——— */
.espelho {
  min-height: calc(100vh - 52px);
  padding: 1.5rem clamp(1rem, 3vw, 2.5rem) 2rem;

.espelho-title {

  letter-spacing: -0.02em;
}

.espelho-pair {

  grid-template-columns: 1fr 1fr;
  gap: 1rem;

}

.espelho-pane {
  padding: 1rem 1rem 1.2rem;

.espelho-pane > p {

.orbita {

  <script>/** Articulated SVG athletes — limb groups for GSAP motion */
window.Bodies = (() => {
  const uid = () => Math.random().toString(36).slice(2, 8);

  function athlete({
    id,
    ink = "#e7e2d6",
    accent = "#c8f542",
    fill = true,
    wide = false,
  }) {
    const iid = id || `ath-${uid()}`;
    const vb = wide ? "0 0 320 200" : "0 0 220 340";
    const shadow = wide
      ? `<ellipse class="b-shadow" cx="160" cy="188" rx="70" ry="6" fill="${ink}" opacity=".12"/>`
      : `<ellipse class="b-shadow" cx="110" cy="328" rx="58" ry="7" fill="${ink}" opacity=".12"/>`;

    if (wide) {
      /* plank / horizontal pose base */
      return `
      <svg id="${iid}" class="fig fig-athlete fig-wide" viewBox="${vb}" aria-hidden="true">
        ${shadow}
        <g class="b-root" fill="${fill ? ink : "none"}" stroke="${ink}" stroke-width="${fill ? 0 : 2.4}" stroke-linecap="round" stroke-linejoin="round">
          <g class="b-head" transform="translate(248,58)">
            <ellipse cx="0" cy="0" rx="16" ry="14" ${fill ? `fill="${ink}" opacity=".95"` : ""}/>
          </g>
          <g class="b-torso" style="transform-box:fill-box;transform-origin:center">
            <path d="M70 78 C120 70, 180 68, 232 62" fill="none" stroke="${ink}" stroke-width="18" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
          </g>
          <g class="b-arm-f" style="transform-box:fill-box;transform-origin:top center">
            <path d="M88 86 L88 128" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>
            <path d="M78 128 H102" fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="b-arm-b" style="transform-box:fill-box;transform-origin:top center">
            <path d="M210 74 L210 118" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round"/>
            <path d="M198 118 H222" fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="b-leg-f" style="transform-box:fill-box;transform-origin:top center">
            <path d="M96 88 L96 140" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round"/>
            <path d="M84 140 H112" fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>
          </g>
          <g class="b-leg-b" style="transform-box:fill-box;transform-origin:top center">
            <path d="M220 76 L220 132" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round"/>
            <path d="M208 132 H236" fill="none" stroke="${ink}" stroke-width="8" stroke-linecap="round"/>
          </g>
          <path class="b-muscle" d="M130 72 C150 78, 170 76, 190 70" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>`;
    }

    /* standing athlete — front/3q, joint hierarchy */
    return `
    <svg id="${iid}" class="fig fig-athlete" viewBox="${vb}" aria-hidden="true">
      ${shadow}
      <g class="b-root" transform="translate(110,40)">
        <g class="b-head" style="transform-box:fill-box;transform-origin:center bottom">
          <circle cx="0" cy="0" r="22" fill="${ink}" opacity="${fill ? 0.95 : 0.15}" stroke="${ink}" stroke-width="2"/>
          <circle cx="8" cy="-2" r="3" fill="${accent}"/>
        </g>
        <g class="b-torso" transform="translate(0,28)" style="transform-box:fill-box;transform-origin:center top">
          <path d="M-28 8 C-34 40,-30 78,-22 110 L22 110 C30 78,34 40,28 8 Z" fill="${ink}" opacity="${fill ? 0.9 : 0.12}" stroke="${ink}" stroke-width="2.2"/>
          <path class="b-muscle" d="M-16 48 C-4 62, 4 62, 16 48" fill="none" stroke="${accent}" stroke-width="3" stroke-linecap="round"/>
          <path class="b-muscle-2" d="M-12 28 C0 36, 0 36, 12 28" fill="none" stroke="${accent}" stroke-width="2" opacity=".75"/>

          <g class="b-arm-l" transform="translate(-30,18)" style="transform-box:fill-box;transform-origin:top center">
            <path d="M0 0 L-6 52" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
            <g class="b-forearm-l" transform="translate(-6,52)" style="transform-box:fill-box;transform-origin:top center">
              <path d="M0 0 L-4 48" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
              <circle class="b-hand" cx="-4" cy="52" r="7" fill="${ink}" opacity="${fill ? 0.9 : 0.2}"/>
            </g>
          </g>
          <g class="b-arm-r" transform="translate(30,18)" style="transform-box:fill-box;transform-origin:top center">
            <path d="M0 0 L6 52" fill="none" stroke="${ink}" stroke-width="12" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
            <g class="b-forearm-r" transform="translate(6,52)" style="transform-box:fill-box;transform-origin:top center">
              <path d="M0 0 L4 48" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
              <circle class="b-hand" cx="4" cy="52" r="7" fill="${ink}" opacity="${fill ? 0.9 : 0.2}"/>
            </g>
          </g>
        </g>

        <g class="b-hip" transform="translate(0,138)" style="transform-box:fill-box;transform-origin:center top">
          <ellipse cx="0" cy="6" rx="24" ry="12" fill="${ink}" opacity="${fill ? 0.88 : 0.12}" stroke="${ink}" stroke-width="2"/>
          <g class="b-thigh-l" transform="translate(-14,10)" style="transform-box:fill-box;transform-origin:top center">
            <path d="M0 0 L-4 70" fill="none" stroke="${ink}" stroke-width="16" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
            <g class="b-shin-l" transform="translate(-4,70)" style="transform-box:fill-box;transform-origin:top center">
              <path d="M0 0 L2 72" fill="none" stroke="${ink}" stroke-width="14" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
              <path class="b-foot-l" d="M-10 72 H22" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${fill ? 0.9 : 1}"/>
            </g>
          </g>
          <g class="b-thigh-r" transform="translate(14,10)" style="transform-box:fill-box;transform-origin:top center">
            <path d="M0 0 L4 70" fill="none" stroke="${ink}" stroke-width="16" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
            <g class="b-shin-r" transform="translate(4,70)" style="transform-box:fill-box;transform-origin:top center">
              <path d="M0 0 L-2 72" fill="none" stroke="${ink}" stroke-width="14" stroke-linecap="round" opacity="${fill ? 0.92 : 1}"/>
              <path class="b-foot-r" d="M-18 72 H14" fill="none" stroke="${ink}" stroke-width="10" stroke-linecap="round" opacity="${fill ? 0.9 : 1}"/>
            </g>
          </g>
        </g>
      </g>
      <g class="b-bar" opacity="0">
        <rect x="28" y="168" width="164" height="7" rx="3" fill="${accent}"/>
        <circle cx="28" cy="171.5" r="14" fill="none" stroke="${accent}" stroke-width="3"/>
        <circle cx="192" cy="171.5" r="14" fill="none" stroke="${accent}" stroke-width="3"/>
      </g>
    </svg>`;
  }

  function maleSquat(opts = {}) {
    return athlete({
      ink: opts.ink || "#e7e2d6",
      accent: opts.accent || "#c8f542",
      fill: opts.mode !== "shaded",
      id: opts.id,
    });
  }

  function femaleLunge(opts = {}) {
    return athlete({
      ink: opts.ink || "#1c1917",
      accent: opts.accent || "#c45c3e",
      fill: opts.mode !== "shaded",
      id: opts.id,
    });
  }

  function neutralDeadlift(opts = {}) {
    const svg = athlete({
      ink: opts.ink || "#d9e2ea",
      accent: opts.accent || "#5ec8ff",
      fill: opts.mode !== "shaded",
      id: opts.id,
    });
    return svg.replace('class="b-bar" opacity="0"', 'class="b-bar" opacity="1"');
  }

  function malePress(opts = {}) {
    return athlete({
      ink: opts.ink || "#f3efe6",
      accent: opts.accent || "#e2b857",
      fill: opts.mode !== "shaded",
      id: opts.id,
    });
  }

  function femalePlank(opts = {}) {
    return athlete({
      ink: opts.ink || "#f5f5f5",
      accent: opts.accent || "#ff7a59",
      fill: true,
      wide: true,
      id: opts.id,
    });
  }

  function miniPose(kind, accent, ink) {
    const map = {
      squat: () => maleSquat({ accent, ink, id: `mini-${uid()}` }),
      lunge: () => femaleLunge({ accent, ink, id: `mini-${uid()}` }),
      deadlift: () => neutralDeadlift({ accent, ink, id: `mini-${uid()}` }),
      press: () => malePress({ accent, ink, id: `mini-${uid()}` }),
      plank: () => femalePlank({ accent, ink, id: `mini-${uid()}` }),
    };
    return (map[kind] || map.squat)();
  }

  return { maleSquat, femaleLunge, neutralDeadlift, malePress, femalePlank, miniPose, athlete };
})();
</script>
  <script>/** Max-motion exercise cycles with GSAP — tuned joint kinematics */
window.BodyMotion = (() => {
  let active = [];

  function killAll() {
    active.forEach((t) => {
      try {
        t.kill();
      } catch (_) {}
    });
    active = [];
    if (typeof gsap !== "undefined") gsap.killTweensOf("*");
  }

  function q(root, sel) {
    return root.querySelector(sel);
  }

  function prefersReduced() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function track(tl) {
    active.push(tl);
    return tl;
  }

  function joints(root) {
    const parts = {
      root: q(root, ".b-root"),
      head: q(root, ".b-head"),
      torso: q(root, ".b-torso"),
      hip: q(root, ".b-hip"),
      thighL: q(root, ".b-thigh-l"),
      thighR: q(root, ".b-thigh-r"),
      shinL: q(root, ".b-shin-l"),
      shinR: q(root, ".b-shin-r"),
      armL: q(root, ".b-arm-l"),
      armR: q(root, ".b-arm-r"),
      forearmL: q(root, ".b-forearm-l"),
      forearmR: q(root, ".b-forearm-r"),
      bar: q(root, ".b-bar"),
      shadow: q(root, ".b-shadow"),
      muscle: q(root, ".b-muscle"),
      muscle2: q(root, ".b-muscle-2"),
      legF: q(root, ".b-leg-f"),
      legB: q(root, ".b-leg-b"),
    };
    const limbKeys = [
      "thighL",
      "thighR",
      "shinL",
      "shinR",
      "armL",
      "armR",
      "forearmL",
      "forearmR",
      "torso",
      "hip",
      "head",
    ];
    limbKeys.forEach((k) => {
      if (parts[k]) gsap.set(parts[k], { transformOrigin: "50% 0%", force3D: false });
    });
    if (parts.head) gsap.set(parts.head, { transformOrigin: "50% 100%" });
    return parts;
  }

  function squat(root, { intensity = 1 } = {}) {
    if (!root || prefersReduced()) return null;
    const p = joints(root);
    const tl = track(gsap.timeline({ repeat: -1, defaults: { ease: "power1.inOut" } }));
    const i = intensity;

    /* descend */
    tl.to(p.hip, { y: 48 * i, duration: 1.2 }, 0)
      .to(p.thighL, { rotation: 58 * i, duration: 1.2 }, 0)
      .to(p.thighR, { rotation: -58 * i, duration: 1.2 }, 0)
      .to(p.shinL, { rotation: -64 * i, duration: 1.2 }, 0)
      .to(p.shinR, { rotation: 64 * i, duration: 1.2 }, 0)
      .to(p.torso, { rotation: 10 * i, y: 4, duration: 1.2 }, 0)
      .to(p.head, { rotation: -8 * i, duration: 1.2 }, 0)
      .to(p.armL, { rotation: -12 * i, duration: 1.2 }, 0)
      .to(p.armR, { rotation: 12 * i, duration: 1.2 }, 0)
      .to(p.shadow, { scaleX: 1.3, transformOrigin: "50% 50%", duration: 1.2 }, 0)
      .to(p.muscle, { attr: { "stroke-width": 4.5 }, opacity: 1, duration: 1.2 }, 0)
      /* hold */
      .to({}, { duration: 0.22 })
      /* ascend — explosive */
      .to(p.hip, { y: 0, duration: 0.95, ease: "power3.out" })
      .to(p.thighL, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.thighR, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.shinL, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.shinR, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.torso, { rotation: 0, y: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.head, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.armL, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.armR, { rotation: 0, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.shadow, { scaleX: 1, duration: 0.95, ease: "power3.out" }, "<")
      .to(p.muscle, { attr: { "stroke-width": 3 }, opacity: 0.85, duration: 0.95 }, "<")
      .to({}, { duration: 0.4 });

    return tl;
  }

  function lunge(root, { intensity = 1 } = {}) {
    if (!root || prefersReduced()) return null;
    const p = joints(root);
    const tl = track(gsap.timeline({ repeat: -1, defaults: { ease: "power1.inOut" } }));
    const i = Math.min(intensity, 1.05);

    tl.to(p.root, { x: -6, duration: 1.25 }, 0)
      .to(p.hip, { y: 22 * i, duration: 1.25 }, 0)
      .to(p.thighL, { rotation: 42 * i, duration: 1.25 }, 0)
      .to(p.shinL, { rotation: -48 * i, duration: 1.25 }, 0)
      .to(p.thighR, { rotation: -22 * i, duration: 1.25 }, 0)
      .to(p.shinR, { rotation: 8 * i, duration: 1.25 }, 0)
      .to(p.torso, { rotation: 5 * i, duration: 1.25 }, 0)
      .to(p.armL, { rotation: -28 * i, duration: 1.25 }, 0)
      .to(p.armR, { rotation: 24 * i, duration: 1.25 }, 0)
      .to({}, { duration: 0.25 })
      .to(p.root, { x: 0, duration: 1.15, ease: "power2.out" })
      .to(p.hip, { y: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.thighL, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.shinL, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.thighR, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.shinR, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.torso, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.armL, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to(p.armR, { rotation: 0, duration: 1.15, ease: "power2.out" }, "<")
      .to({}, { duration: 0.35 });

    return tl;
  }

  function deadlift(root) {
    if (!root || prefersReduced()) return null;
    const p = joints(root);
    const tl = track(gsap.timeline({ repeat: -1, defaults: { ease: "power1.inOut" } }));

    if (p.bar) gsap.set(p.bar, { opacity: 1, y: 36 });

    /* hinge down */
    tl.to(p.torso, { rotation: 42, y: 10, duration: 1.15 }, 0)
      .to(p.hip, { y: 10, duration: 1.15 }, 0)
      .to(p.head, { rotation: -10, duration: 1.15 }, 0)
      .to(p.thighL, { rotation: 18, duration: 1.15 }, 0)
      .to(p.thighR, { rotation: -18, duration: 1.15 }, 0)
      .to(p.armL, { rotation: 6, duration: 1.15 }, 0)
      .to(p.armR, { rotation: -6, duration: 1.15 }, 0)
      .to(p.bar, { y: 52, duration: 1.15 }, 0)
      .to({}, { duration: 0.18 })
      /* lockout */
      .to(p.torso, { rotation: 0, y: 0, duration: 0.9, ease: "power3.out" })
      .to(p.hip, { y: 0, duration: 0.9, ease: "power3.out" }, "<")
      .to(p.head, { rotation: 0, duration: 0.9, ease: "power3.out" }, "<")
      .to(p.thighL, { rotation: 0, duration: 0.9, ease: "power3.out" }, "<")
      .to(p.thighR, { rotation: 0, duration: 0.9, ease: "power3.out" }, "<")
      .to(p.bar, { y: 0, duration: 0.9, ease: "power3.out" }, "<")
      .to({}, { duration: 0.5 });

    return tl;
  }

  function press(root) {
    if (!root || prefersReduced()) return null;
    const p = joints(root);
    const tl = track(gsap.timeline({ repeat: -1, defaults: { ease: "power1.inOut" } }));

    if (p.bar) gsap.set(p.bar, { opacity: 1, y: -88, scaleX: 0.72, transformOrigin: "50% 50%" });
    gsap.set(p.forearmL, { rotation: -95 });
    gsap.set(p.forearmR, { rotation: 95 });

    tl.to(p.armL, { rotation: -150, duration: 0.95 }, 0)
      .to(p.armR, { rotation: 150, duration: 0.95 }, 0)
      .to(p.forearmL, { rotation: -15, duration: 0.95 }, 0)
      .to(p.forearmR, { rotation: 15, duration: 0.95 }, 0)
      .to(p.bar, { y: -168, duration: 0.95 }, 0)
      .to(p.torso, { y: -3, duration: 0.95 }, 0)
      .to({}, { duration: 0.22 })
      .to(p.armL, { rotation: 0, duration: 1.05, ease: "power2.inOut" })
      .to(p.armR, { rotation: 0, duration: 1.05, ease: "power2.inOut" }, "<")
      .to(p.forearmL, { rotation: -95, duration: 1.05, ease: "power2.inOut" }, "<")
      .to(p.forearmR, { rotation: 95, duration: 1.05, ease: "power2.inOut" }, "<")
      .to(p.bar, { y: -88, duration: 1.05, ease: "power2.inOut" }, "<")
      .to(p.torso, { y: 0, duration: 1.05 }, "<")
      .to({}, { duration: 0.35 });

    return tl;
  }

  function plank(root) {
    if (!root || prefersReduced()) return null;
    const p = joints(root);
    const tl = track(
      gsap.timeline({ repeat: -1, yoyo: true, defaults: { ease: "sine.inOut" } }),
    );

    tl.to(p.torso, { y: -4, duration: 1.5 }, 0)
      .to(p.head, { y: -3, rotation: -5, duration: 1.5 }, 0)
      .to(p.muscle, { opacity: 1, attr: { "stroke-width": 4 }, duration: 1.5 }, 0)
      .to(p.legF, { y: 2, duration: 1.5 }, 0)
      .to(p.legB, { y: -2, duration: 1.5 }, 0);

    return tl;
  }

  function pulseAccent(root) {
    if (!root || prefersReduced()) return null;
    const muscle = root.querySelectorAll(".b-muscle, .b-muscle-2");
    if (!muscle.length) return null;
    return track(
      gsap.to(muscle, {
        opacity: 0.4,
        duration: 0.85,
        yoyo: true,
        repeat: -1,
        ease: "sine.inOut",
        stagger: 0.12,
      }),
    );
  }

  function bootStage(stage) {
    killAll();
    if (!stage || typeof gsap === "undefined") return;
    stage.querySelectorAll(".fig-athlete[data-motion]").forEach((el, i) => {
      const kind = el.dataset.motion;
      const delay = Number(el.dataset.delay || 0) + i * 0.06;
      const intensity = Number(el.dataset.intensity || 1);
      const map = { squat, lunge, deadlift, press, plank };
      const fn = map[kind] || squat;
      const run = () => {
        fn(el, { intensity });
        pulseAccent(el);
      };
      if (delay) {
        const d = gsap.delayedCall(delay, run);
        active.push(d);
      } else run();
    });
  }

  return { squat, lunge, deadlift, press, plank, bootStage, killAll };
})();
</script>

  ];
  return shell(
    "orbita",
    `
    <section class="orbita">
      <div class="orbita-ring">
        ${nodes
          .map(
            (n) => `
          <button type="button" class="orbita-node ${state.orbita === n.id ? "on" : ""}" style="--a:${n.a}deg" data-orbita="${n.id}">
            ${n.label}
          </button>`,
          )
          .join("")}
        <div class="orbita-core">
          ${mot(B.neutralDeadlift({ mode: "silhouette", accent: "#a78bfa", ink: "#eceaf5" }), "deadlift")}
        </div>
      </div>
      <aside class="orbita-info">
        <p>Anatomia radial</p>
        <h1>${nodes.find((n) => n.id === state.orbita).label}</h1>
        <p>Gire o foco pelo anel. O corpo neutro fica no centro como âncora visual da consulta.</p>
      </aside>
    </section>`,
  );
}

/* ——— 10 GIZ ——— */
function renderGiz() {
  return shell(
    "giz",
    `
    <section class="giz">
      <div class="giz-board">
        <header>
          <p>Sessão · 23 nov</p>
          <h1>Agachamento — cues</h1>
        </header>
        <div class="giz-body">
          ${mot(B.maleSquat({ mode: "shaded", accent: "#f5e6c8", ink: "#f5e6c8" }), "squat")}
          <svg class="giz-marks" viewBox="0 0 200 320" aria-hidden="true">

            <text x="150" y="88" fill="#f5e6c8" font-size="11" font-family="IBM Plex Mono, monospace">peito ↑</text>

const RENDERERS = {
  forma: renderForma,
  atlas: renderAtlas,
  link: renderLink,
  acervo: renderAcervo,
  estudio: renderEstudio,
  rolo: renderRolo,
  traco: renderTraco,
  espelho: renderEspelho,
  orbita: renderOrbita,
  giz: renderGiz,
};

function render() {
  if (window.BodyMotion) BodyMotion.killAll();
  app.innerHTML = state.view === "hub" ? renderHub() : RENDERERS[state.proto]();
  wire();
  requestAnimationFrame(() => {
    if (window.BodyMotion) BodyMotion.bootStage(app);
  });
}

function wire() {
  app.querySelectorAll("[data-open]").forEach((el) =>
    el.addEventListener("click", () => openProto(el.dataset.open)),
  );
  app.querySelectorAll("[data-hub]").forEach((el) => el.addEventListener("click", goHub));
  app.querySelectorAll("[data-prev]").forEach((el) =>
    el.addEventListener("click", () => shiftProto(-1)),
  );
  app.querySelectorAll("[data-next]").forEach((el) =>
    el.addEventListener("click", () => shiftProto(1)),
  );
  app.querySelectorAll("[data-atlas]").forEach((el) =>
    el.addEventListener("click", () => {
      state.atlasFocus = el.dataset.atlas;
      render();
    }),
  );
  app.querySelectorAll("[data-acervo]").forEach((el) =>
    el.addEventListener("click", () => {
      state.acervoFilter = el.dataset.acervo;
      render();
    }),
  );
  app.querySelectorAll("[data-orbita]").forEach((el) =>
    el.addEventListener("click", () => {
      state.orbita = el.dataset.orbita;
      render();
    }),
  );
}

document.addEventListener("keydown", (e) => {
  if (state.view !== "proto") return;
  if (e.key === "ArrowLeft") shiftProto(-1);
  if (e.key === "ArrowRight") shiftProto(1);
  if (e.key === "Escape") goHub();
});

render();
</script>

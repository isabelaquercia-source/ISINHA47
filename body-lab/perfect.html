<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Body Lab · Etapa 1 · Agachamento</title>
<style>
  :root {
    --bg0:#050607; --accent:#c8f542; --ink:#f3efe6; --muted:#9aa193;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;min-height:100%;color:var(--ink);
    background:
      radial-gradient(ellipse 90% 55% at 65% 30%,#1c2a14 0%,transparent 55%),
      var(--bg0);
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  }
  .top{
    display:flex;justify-content:space-between;align-items:center;
    padding:.85rem 1rem;position:sticky;top:0;z-index:5;
    background:#050607cc;border-bottom:1px solid #ffffff12;
  }
  .top a{
    color:var(--ink);text-decoration:none;padding:.4rem .7rem;
    border-radius:.5rem;background:#ffffff12;font-size:.85rem;
  }
  .top .meta{text-align:center}
  .top strong{display:block;font-size:.95rem}
  .top small{color:var(--muted);font-size:.72rem}
  .stage{
    min-height:calc(100dvh - 56px);
    display:grid;grid-template-rows:1.15fr auto;
    padding:0 1rem 1.4rem;
  }
  .canvas{display:grid;place-items:center;padding-top:.5rem}
  .athlete{
    width:min(94vw,440px);height:auto;overflow:visible;
    filter:drop-shadow(0 20px 28px #00000099);
  }
  .copy{max-width:28rem;margin:0 auto;width:100%}
  .eyebrow{margin:0;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  h1{margin:.35rem 0 0;font-size:clamp(1.9rem,7.5vw,2.8rem);letter-spacing:-.03em;line-height:1.05}
  .copy p{margin:.5rem 0 0;color:var(--muted);line-height:1.45}
  .meter{margin-top:1rem;height:4px;border-radius:99px;background:#ffffff14;overflow:hidden}
  .meter>i{display:block;height:100%;width:20%;background:var(--accent);border-radius:99px}
  .next{
    display:inline-block;margin-top:1rem;padding:.7rem 1rem;border-radius:999px;
    background:var(--accent);color:#101408;font-weight:700;text-decoration:none;font-size:.9rem;
  }
  @media (prefers-reduced-motion:reduce){
    .athlete{animation:none}
  }
</style>
</head>
<body>
<header class="top">
  <a href="./mobile.html">← Hub</a>
  <div class="meta"><strong>Etapa 1 · Forma</strong><small>Agachamento · pivôs reais</small></div>
  <a href="./mobile.html#atlas">Próximo ›</a>
</header>

<main class="stage">
  <div class="canvas">
    <svg id="athlete" class="athlete" viewBox="0 0 400 560" aria-label="Agachamento animado vista lateral">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f0dfc6"/>
          <stop offset="50%" stop-color="#c9a57c"/>
          <stop offset="100%" stop-color="#7d5c3f"/>
        </linearGradient>
        <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e8d2b4"/>
          <stop offset="100%" stop-color="#9a7350"/>
        </linearGradient>
      </defs>

      <ellipse id="floor" cx="210" cy="520" rx="100" ry="11" fill="#c8f542" opacity=".16"/>

      <!-- HIP is the master joint at standing position -->
      <g id="hip" transform="translate(200 250)">
        <!-- TORSO stacks upward from hip -->
        <g id="torso">
          <path d="M-8 0
                   C-22 18,-30 48,-28 78
                   C-26 102,-16 118,-2 124
                   L22 118
                   C30 98,32 72,28 48
                   C24 24,12 6,2 0 Z" fill="url(#skin)"/>
          <path id="coreGlow" d="M0 36 C4 52,8 70,10 92" fill="none" stroke="#c8f542" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
          <ellipse cx="6" cy="28" rx="16" ry="13" fill="url(#skin2)"/>
          <path d="M-10 34 C-2 50,4 66,6 84" fill="none" stroke="#5a4030" stroke-width="2" opacity=".28" stroke-linecap="round"/>

          <g id="head" transform="translate(6 -6)">
            <ellipse cx="2" cy="-34" rx="19" ry="22" fill="url(#skin)"/>
            <ellipse cx="8" cy="-38" rx="6" ry="4.5" fill="#f7ecdc" opacity=".4"/>
            <path d="M-4 -12 C0 -2,8 2,14 -4" fill="url(#skin2)"/>
            <circle cx="10" cy="-36" r="2.3" fill="#c8f542"/>
          </g>

          <g id="arm" transform="translate(18 26)">
            <path d="M0 0 C10 18,14 38,12 58" fill="none" stroke="url(#skin)" stroke-width="15" stroke-linecap="round"/>
            <g id="forearm" transform="translate(12 58)">
              <path d="M0 0 C8 16,10 34,6 50" fill="none" stroke="url(#skin2)" stroke-width="12" stroke-linecap="round"/>
              <ellipse cx="6" cy="56" rx="7.5" ry="5.5" fill="url(#skin)"/>
            </g>
          </g>
        </g>

        <!-- THIGH from hip downward; knee at local (0,95) -->
        <g id="thigh">
          <ellipse cx="2" cy="8" rx="20" ry="15" fill="url(#skin)"/>
          <path d="M0 4 C-2 34,0 64,4 95" fill="none" stroke="url(#skin)" stroke-width="26" stroke-linecap="round"/>
          <path d="M2 12 C2 40,4 68,6 90" fill="none" stroke="#f2e4d0" stroke-width="7" stroke-linecap="round" opacity=".22"/>
          <path id="quadGlow" d="M-4 28 C2 48,6 68,8 86" fill="none" stroke="#c8f542" stroke-width="3.2" stroke-linecap="round" opacity=".75"/>

          <g id="shin" transform="translate(4 95)">
            <circle cx="0" cy="0" r="10" fill="url(#skin2)"/>
            <path d="M0 0 C2 30,2 58,0 92" fill="none" stroke="url(#skin)" stroke-width="20" stroke-linecap="round"/>
            <path d="M0 6 C2 34,2 60,0 86" fill="none" stroke="#f0e0c8" stroke-width="5" stroke-linecap="round" opacity=".2"/>
            <g id="foot" transform="translate(0 92)">
              <path d="M-10 0 C6 4,34 6,52 2 C58 0,58 -4,50 -8 C28 -12,6 -8,-8 -4 Z" fill="url(#skin)"/>
            </g>
          </g>
        </g>

        <!-- depth arm -->
        <path d="M-18 8 C-34 28,-40 48,-34 66" fill="none" stroke="#8a6a4a" stroke-width="11" stroke-linecap="round" opacity=".32"/>
      </g>
    </svg>
  </div>

  <div class="copy">
    <p class="eyebrow">Etapa 1 de 4 · motion premium</p>
    <h1>Agachamento<br/>com forma limpa</h1>
    <p>Vista lateral com pivôs de verdade: quadril, joelho, tornozelo, tronco e braço. Sem CDN — roda no celular.</p>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <a class="next" href="./mobile.html">Ver hub mobile ›</a>
  </div>
</main>

<script>
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const hip = document.getElementById("hip");
  const torso = document.getElementById("torso");
  const head = document.getElementById("head");
  const thigh = document.getElementById("thigh");
  const shin = document.getElementById("shin");
  const foot = document.getElementById("foot");
  const arm = document.getElementById("arm");
  const forearm = document.getElementById("forearm");
  const floor = document.getElementById("floor");
  const meter = document.getElementById("meter");
  const coreGlow = document.getElementById("coreGlow");
  const quadGlow = document.getElementById("quadGlow");

  const L1 = 95;   // thigh length (hip → knee)
  const L2 = 92;   // shin length (knee → ankle)
  const FOOT = { x: 218, y: 500 }; // planted ankle target
  const HIP_STAND = { x: 200, y: 313 };
  const HIP_DEPTH = { x: 188, y: 392 };

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function squatPhase(ms) {
    const cycle = 2800;
    const x = (ms % cycle) / cycle;
    if (x < 0.4) return easeInOut(x / 0.4);
    if (x < 0.5) return 1;
    if (x < 0.9) return 1 - easeInOut((x - 0.5) / 0.4);
    return 0;
  }

  /** 2-bone IK: limbs drawn along +Y; SVG rotate is clockwise */
  function legIK(hipX, hipY, footX, footY) {
    let dx = footX - hipX;
    let dy = footY - hipY;
    let d = Math.hypot(dx, dy);
    d = clamp(d, Math.abs(L1 - L2) + 1, L1 + L2 - 1);

    // angle from +Y (down) toward +X
    const base = Math.atan2(dx, dy) * 180 / Math.PI;
    const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    const a = Math.acos(clamp(cosA, -1, 1)) * 180 / Math.PI;
    const cosB = (L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2);
    const bend = Math.acos(clamp(cosB, -1, 1)) * 180 / Math.PI;

    // knee forward (+X): thigh = base - a
    const thighDeg = base - a;
    // shin local relative to thigh so world shin aims to foot
    const shinWorld = base + a; // other complementary
    // Actually: knee at hip + L1 along thighDeg; shin should go to foot
    // local shin rotation = (angle of shin from +Y) - thighDeg
    const kneeX = hipX + L1 * Math.sin(thighDeg * Math.PI / 180);
    const kneeY = hipY + L1 * Math.cos(thighDeg * Math.PI / 180);
    const shinDeg = Math.atan2(footX - kneeX, footY - kneeY) * 180 / Math.PI - thighDeg;

    // foot flat: world rotation ~ 0 relative to ground; local = -shinWorld
    const footDeg = - (thighDeg + shinDeg);

    return { thighDeg, shinDeg, footDeg, bend };
  }

  function frame(now) {
    const t = squatPhase(now);

    const hx = lerp(HIP_STAND.x, HIP_DEPTH.x, t);
    const hy = lerp(HIP_STAND.y, HIP_DEPTH.y, t);
    hip.setAttribute("transform", "translate(" + hx + " " + hy + ")");

    const ik = legIK(hx, hy, FOOT.x, FOOT.y);
    thigh.setAttribute("transform", "rotate(" + ik.thighDeg + ")");
    shin.setAttribute("transform", "translate(4 95) rotate(" + ik.shinDeg + ")");
    foot.setAttribute("transform", "translate(0 92) rotate(" + clamp(ik.footDeg, -18, 8) + ")");

    // torso lean scales with depth (keep athletic, not horizontal)
    const lean = lerp(8, 24, t);
    torso.setAttribute("transform", "rotate(" + lean + ")");
    head.setAttribute("transform", "translate(6 -6) rotate(" + lerp(-3, -10, t) + ")");

    arm.setAttribute("transform", "translate(18 26) rotate(" + lerp(12, 48, t) + ")");
    forearm.setAttribute("transform", "translate(12 58) rotate(" + lerp(8, 22, t) + ")");

    floor.setAttribute("cx", String(FOOT.x - 8));
    floor.setAttribute("cy", "520");
    floor.setAttribute("rx", String(lerp(100, 118, t)));
    floor.setAttribute("opacity", String(lerp(0.14, 0.26, t)));
    meter.style.width = (16 + 70 * t) + "%";
    coreGlow.setAttribute("opacity", String(lerp(0.4, 1, t)));
    quadGlow.setAttribute("opacity", String(lerp(0.35, 1, t)));

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

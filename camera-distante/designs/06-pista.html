<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>06 · Pista</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "IBM Plex Sans", sans-serif; background: #041828; color: #e8f6ff; }
    .frame { position: absolute; inset: 0; display: flex; flex-direction: column; }
    canvas#highway { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lanes {
      position: absolute; left: 0; right: 0; top: 48%; height: 16%; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, transparent 8%, rgba(255,77,109,.12) 8%, transparent 9%, transparent 91%, rgba(255,77,109,.12) 91%, transparent 92%);
    }
    .top { position: relative; z-index: 2; padding: 12px 14px 0; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .top button, .bottom button { pointer-events: auto; }
    .ghost {
      height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(120,200,255,.35);
      background: rgba(4,24,40,.8); color: #9fd4ff; font-weight: 700; font-size: 12px;
    }
    .mint {
      height: 36px; padding: 0 14px; border-radius: 12px; border: 0;
      background: #ff4d6d; color: #fff; font-weight: 800; font-size: 12px; margin-left: auto;
    }
    .lyrics { position: relative; z-index: 2; text-align: center; padding: 14px 16px 0; pointer-events: none; }
    #lyricNow { font-family: "Bebas Neue", sans-serif; font-size: clamp(1.6rem, 7vw, 2.4rem); letter-spacing: .04em; }
    .hi { color: #fff; text-shadow: 0 0 18px rgba(255,77,109,.55); } .lo { color: rgba(232,246,255,.35); }
    #lyricNext { margin-top: 0; font-size: 12px; font-weight: 700; color: #7eb7e0; }
    .hud {
      position: absolute; right: 14px; top: 58px; z-index: 2; text-align: right; pointer-events: none;
      font-family: "Bebas Neue", sans-serif; font-size: 28px; line-height: 1; color: #ff4d6d;
    }
    .hud small { display: block; font-family: "IBM Plex Sans", sans-serif; font-size: 10px; letter-spacing: .12em; color: #9fd4ff; }
    .hint { position: relative; z-index: 2; margin-top: auto; text-align: center; padding-bottom: 10px; pointer-events: none; }
    .hint span {
      display: inline-block; font-size: 11px; font-weight: 700; color: #fff;
      background: rgba(255,77,109,.85); padding: 7px 14px; border-radius: 10px;
    }
    body.is-playing .hint { display: none; }
    .bottom { position: relative; z-index: 3; padding: 8px 14px 18px; display: flex; align-items: center; gap: 12px; }
    #btnPlay {
      width: 50px; height: 50px; border: 0; border-radius: 16px; display: grid; place-items: center;
      background: linear-gradient(180deg, #5eead4, #14b8a6); color: #042f2e;
      box-shadow: 0 8px 22px rgba(20,184,166,.35);
    }
    .hidden { display: none !important; }
    .map {
      flex: 1; height: 36px; border-radius: 14px; background: rgba(2,12,24,.9);
      border: 1px solid rgba(120,200,255,.25); padding: 0 10px; display: flex; align-items: center;
    }
    #minimap { width: 100%; height: 22px; display: block; }
    .tag {
      position: absolute; left: 14px; top: 58px; z-index: 2; font-family: "Bebas Neue", sans-serif;
      font-size: 20px; letter-spacing: .08em; color: #9fd4ff; pointer-events: none;
    }
    #speedPanel {
      display: none; position: absolute; left: 14px; right: 14px; top: 58px; z-index: 4;
      background: rgba(4,24,40,.95); border: 1px solid rgba(255,77,109,.5); border-radius: 14px;
      padding: 8px 12px; align-items: center; gap: 8px;
    }
    #speedPanel.open { display: flex; }
    #speedPanel button {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ff4d6d; background: transparent; color: #ff4d6d; font-weight: 800;
    }
    #speedSlider { flex: 1; accent-color: #ff4d6d; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="highway"></canvas>
    <div class="lanes"></div>
    <div class="top">
      <button class="ghost" id="btnBack" type="button">← Ideias</button>
      <button class="mint" id="btnSpeed" type="button"><span data-speed>100%</span></button>
    </div>
    <div id="speedPanel">
      <button id="speedDown" type="button">−</button>
      <input id="speedSlider" type="range" min="50" max="125" step="5" value="100" />
      <button id="speedUp" type="button">+</button>
      <span class="mint" data-speed>100%</span>
    </div>
    <div class="tag">06 PISTA</div>
    <div class="hud"><small>COMBO</small>x1</div>
    <div class="lyrics">
      <div id="lyricNow"><span class="hi">One, two</span></div>
      <div id="lyricNext">Oh, life is bigger</div>
    </div>
    <div class="hint"><span>ZONA DE TAP ↓</span></div>
    <div class="bottom">
      <button id="btnPlay" type="button">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg id="iconPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </button>
      <div class="map"><canvas id="minimap"></canvas></div>
    </div>
  </div>
  <script>
    window.CD_THEME = {
      skyTop: "#062a40", skyMid: "#0b3d5c", skyBot: "#0e4a6e",
      seaTop: "#0a2040", seaMid: "#1a1858", seaBot: "#3a1860",
      boardTop: "#1a2430", boardBot: "#0c1218",
      stringHi: "#d7e8f5", stringLo: "#e8a060",
      accent: "#14b8a6", pause: "#ff4d6d",
      boardY: 0.48, boardH: 0.16,
      font: "IBM Plex Sans, sans-serif", displayFont: "Bebas Neue, sans-serif"
    };
  </script>
  <script src="../js/engine.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>03 · Atlas</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600;6..72,700&family=Figtree:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Figtree, sans-serif; background: #eef3ef; color: #173028; }
    .frame { position: absolute; inset: 0; display: flex; flex-direction: column; }
    canvas#highway { position: absolute; inset: 0; width: 100%; height: 100%; }
    .top { position: relative; z-index: 2; padding: 12px 14px 0; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .top button, .bottom button { pointer-events: auto; }
    .ghost {
      height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #c5d5cc;
      background: rgba(255,255,255,.88); color: #173028; font-weight: 700; font-size: 12px;
    }
    .mint {
      height: 36px; padding: 0 14px; border-radius: 999px; border: 0;
      background: #173028; color: #e8fff4; font-weight: 800; font-size: 12px; margin-left: auto;
    }
    .lyrics { position: relative; z-index: 2; text-align: center; padding: 16px 20px 0; pointer-events: none; }
    #lyricNow { font-family: Newsreader, Georgia, serif; font-size: clamp(1.15rem, 4.8vw, 1.55rem); font-weight: 700; }
    .hi { color: #0f3d32; } .lo { color: rgba(23,48,40,.35); }
    #lyricNext { margin-top: 4px; font-size: 12px; color: #5f7a70; font-weight: 600; }
    .hint { position: relative; z-index: 2; margin-top: auto; text-align: center; padding-bottom: 12px; pointer-events: none; }
    .hint span {
      font-size: 11px; font-weight: 700; color: #35574c;
      background: rgba(255,255,255,.75); padding: 6px 12px; border-radius: 999px; border: 1px solid #cfe0d7;
    }
    body.is-playing .hint { display: none; }
    .bottom { position: relative; z-index: 3; padding: 8px 14px 18px; display: flex; align-items: center; gap: 12px; }
    #btnPlay {
      width: 48px; height: 48px; border: 0; border-radius: 999px; display: grid; place-items: center;
      background: #0f766e; color: #e8fff8; box-shadow: 0 8px 18px rgba(15,118,110,.28);
    }
    .hidden { display: none !important; }
    .map {
      flex: 1; height: 34px; border-radius: 999px; background: #fff; border: 1px solid #d5e2db;
      padding: 0 10px; display: flex; align-items: center;
    }
    #minimap { width: 100%; height: 22px; display: block; }
    .tag {
      position: absolute; left: 14px; top: 56px; z-index: 2; font-family: Newsreader, serif;
      font-size: 14px; color: #35574c; pointer-events: none;
    }
    #speedPanel {
      display: none; position: absolute; left: 14px; right: 14px; top: 56px; z-index: 4;
      background: #fff; border: 1px solid #cfe0d7; border-radius: 999px;
      padding: 8px 12px; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(23,48,40,.12);
    }
    #speedPanel.open { display: flex; }
    #speedPanel button {
      width: 28px; height: 28px; border-radius: 999px; border: 1px solid #173028; background: #fff; color: #173028; font-weight: 800;
    }
    #speedSlider { flex: 1; accent-color: #0f766e; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="highway"></canvas>
    <div class="top">
      <button class="ghost" id="btnBack" type="button">← Ideias</button>
      <button class="mint" id="btnSpeed" type="button"><span data-speed>100%</span></button>
    </div>
    <div id="speedPanel">
      <button id="speedDown" type="button">−</button>
      <input id="speedSlider" type="range" min="50" max="125" step="5" value="100" />
      <button id="speedUp" type="button">+</button>
      <span class="mint" data-speed>100%</span>
    </div>
    <div class="tag">03 · Atlas</div>
    <div class="lyrics">
      <div id="lyricNow"><span class="hi">One, two</span></div>
      <div id="lyricNext">Oh, life is bigger</div>
    </div>
    <div class="hint"><span>Estudo claro — toque na faixa de baixo</span></div>
    <div class="bottom">
      <button id="btnPlay" type="button">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg id="iconPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </button>
      <div class="map"><canvas id="minimap"></canvas></div>
    </div>
  </div>
  <script>
    window.CD_THEME = {
      skyTop: "#f7f3ea", skyMid: "#e8eef0", skyBot: "#d5e4df",
      seaTop: "#c5d9d0", seaMid: "#aec9c0", seaBot: "#8fb3a8",
      boardTop: "#3d4744", boardBot: "#2a312f",
      stringHi: "#eef2f0", stringLo: "#d2b48c",
      accent: "#0f766e", pause: "#334155",
      boardY: 0.5, boardH: 0.13,
      font: "Figtree, sans-serif", displayFont: "Newsreader, serif"
    };
  </script>
  <script src="../js/engine.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>05 · Vinil</title>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,700;1,400&family=Source+Sans+3:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Source Sans 3", sans-serif; background: #2a1410; color: #f6e7d4; }
    .frame { position: absolute; inset: 0; display: flex; flex-direction: column; }
    canvas#highway { position: absolute; inset: 0; width: 100%; height: 100%; }
    .grain {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .top { position: relative; z-index: 2; padding: 14px 16px 0; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .top button, .bottom button { pointer-events: auto; }
    .ghost {
      height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(246,231,212,.28);
      background: rgba(42,20,16,.7); color: #f6e7d4; font-weight: 700; font-size: 12px;
    }
    .mint {
      height: 36px; padding: 0 14px; border-radius: 999px; border: 0;
      background: #e8b06a; color: #3a1c10; font-weight: 800; font-size: 12px; margin-left: auto;
    }
    .lyrics { position: relative; z-index: 2; text-align: center; padding: 22px 22px 0; pointer-events: none; }
    #lyricNow { font-family: "Libre Baskerville", Georgia, serif; font-size: clamp(1.1rem, 4.6vw, 1.45rem); font-style: italic; }
    .hi { color: #fff3e2; } .lo { color: rgba(246,231,212,.38); }
    #lyricNext { margin-top: 6px; font-size: 12px; color: rgba(232,176,106,.75); font-weight: 600; }
    .hint { position: relative; z-index: 2; margin-top: auto; text-align: center; padding-bottom: 12px; pointer-events: none; }
    .hint span { font-size: 11px; color: rgba(246,231,212,.7); }
    body.is-playing .hint { display: none; }
    .bottom { position: relative; z-index: 3; padding: 8px 16px 20px; display: flex; align-items: center; gap: 12px; }
    #btnPlay {
      width: 50px; height: 50px; border: 0; border-radius: 999px; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, #f0c48a, #c47a3a 60%, #7a3e18);
      color: #2a1410; box-shadow: 0 8px 22px rgba(0,0,0,.35);
    }
    .hidden { display: none !important; }
    .map {
      flex: 1; height: 34px; border-radius: 999px; background: rgba(18,8,6,.85);
      border: 1px solid rgba(232,176,106,.28); padding: 0 10px; display: flex; align-items: center;
    }
    #minimap { width: 100%; height: 22px; display: block; }
    .tag {
      position: absolute; left: 16px; top: 58px; z-index: 2; font-family: "Libre Baskerville", serif;
      font-size: 13px; font-style: italic; color: #e8b06a; pointer-events: none;
    }
    #speedPanel {
      display: none; position: absolute; left: 16px; right: 16px; top: 58px; z-index: 4;
      background: rgba(42,20,16,.95); border: 1px solid rgba(232,176,106,.35); border-radius: 999px;
      padding: 8px 12px; align-items: center; gap: 8px;
    }
    #speedPanel.open { display: flex; }
    #speedPanel button {
      width: 28px; height: 28px; border-radius: 999px; border: 1px solid #e8b06a; background: transparent; color: #e8b06a; font-weight: 800;
    }
    #speedSlider { flex: 1; accent-color: #e8b06a; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="highway"></canvas>
    <div class="grain"></div>
    <div class="top">
      <button class="ghost" id="btnBack" type="button">← Ideias</button>
      <button class="mint" id="btnSpeed" type="button"><span data-speed>100%</span></button>
    </div>
    <div id="speedPanel">
      <button id="speedDown" type="button">−</button>
      <input id="speedSlider" type="range" min="50" max="125" step="5" value="100" />
      <button id="speedUp" type="button">+</button>
      <span class="mint" data-speed>100%</span>
    </div>
    <div class="tag">05 · Vinil</div>
    <div class="lyrics">
      <div id="lyricNow"><span class="hi">One, two</span></div>
      <div id="lyricNext">Oh, life is bigger</div>
    </div>
    <div class="hint"><span>Lado A — toque na madeira de baixo</span></div>
    <div class="bottom">
      <button id="btnPlay" type="button">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg id="iconPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </button>
      <div class="map"><canvas id="minimap"></canvas></div>
    </div>
  </div>
  <script>
    window.CD_THEME = {
      skyTop: "#5c2a16", skyMid: "#3a1a10", skyBot: "#24100c",
      seaTop: "#1a0c08", seaMid: "#2a140e", seaBot: "#3b1c12",
      boardTop: "#4a2e1c", boardBot: "#2a1a10",
      stringHi: "#f0e0c8", stringLo: "#c9955a",
      accent: "#e8b06a", pause: "#7a3e18",
      boardY: 0.49, boardH: 0.145,
      font: "Source Sans 3, sans-serif", displayFont: "Libre Baskerville, serif"
    };
  </script>
  <script src="../js/engine.js"></script>
</body>
</html>

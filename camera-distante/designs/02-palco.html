<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>02 · Palco</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Outfit, sans-serif; background: #0b0a12; color: #ffe8c8; }
    .frame { position: absolute; inset: 0; display: flex; flex-direction: column; }
    canvas#highway { position: absolute; inset: 0; width: 100%; height: 100%; }
    .vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(120% 70% at 50% 30%, transparent 40%, rgba(0,0,0,.45) 100%);
    }
    .top { position: relative; z-index: 2; padding: 14px 16px 0; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
    .top button, .bottom button { pointer-events: auto; }
    .ghost {
      height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,200,140,.25);
      background: rgba(20,12,8,.75); color: #ffd7a8; font-weight: 700; font-size: 12px;
    }
    .mint {
      height: 36px; padding: 0 14px; border-radius: 10px; border: 0;
      background: linear-gradient(180deg, #ffb347, #e8890c); color: #2a1400; font-weight: 800; font-size: 12px; margin-left: auto;
    }
    .lyrics { position: relative; z-index: 2; text-align: center; padding: 18px 20px 0; pointer-events: none; }
    #lyricNow { font-family: "Instrument Serif", serif; font-size: clamp(1.2rem, 5vw, 1.7rem); font-style: italic; }
    .hi { color: #fff4e6; } .lo { color: rgba(255,228,180,.4); }
    #lyricNext { margin-top: 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,200,140,.55); }
    .hint { position: relative; z-index: 2; margin-top: auto; text-align: center; padding-bottom: 12px; pointer-events: none; }
    .hint span { font-size: 11px; color: rgba(255,220,180,.65); }
    body.is-playing .hint { display: none; }
    .bottom { position: relative; z-index: 3; padding: 8px 16px 20px; display: flex; align-items: center; gap: 12px; }
    #btnPlay {
      width: 48px; height: 48px; border: 0; border-radius: 14px; display: grid; place-items: center;
      background: #ff9f1c; color: #2a1400; box-shadow: 0 0 30px rgba(255,159,28,.35);
    }
    .hidden { display: none !important; }
    .map {
      flex: 1; height: 34px; border-radius: 12px; background: rgba(10,8,16,.9);
      border: 1px solid rgba(255,180,100,.2); padding: 0 10px; display: flex; align-items: center;
    }
    #minimap { width: 100%; height: 22px; display: block; }
    .tag {
      position: absolute; left: 16px; top: 58px; z-index: 2; font-family: "Instrument Serif", serif;
      font-size: 15px; color: #ffc98a; opacity: .9; pointer-events: none;
    }
    #speedPanel {
      display: none; position: absolute; left: 16px; right: 16px; top: 58px; z-index: 4;
      background: rgba(24,14,8,.95); border: 1px solid rgba(255,180,100,.3); border-radius: 14px;
      padding: 10px 12px; align-items: center; gap: 8px;
    }
    #speedPanel.open { display: flex; }
    #speedPanel button {
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid #ffb347; background: transparent; color: #ffb347; font-weight: 800;
    }
    #speedSlider { flex: 1; accent-color: #ff9f1c; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="highway"></canvas>
    <div class="vignette"></div>
    <div class="top">
      <button class="ghost" id="btnBack" type="button">← Ideias</button>
      <button class="mint" id="btnSpeed" type="button">Vel <span data-speed>100%</span></button>
    </div>
    <div id="speedPanel">
      <button id="speedDown" type="button">−</button>
      <input id="speedSlider" type="range" min="50" max="125" step="5" value="100" />
      <button id="speedUp" type="button">+</button>
      <span class="mint" data-speed>100%</span>
    </div>
    <div class="tag">02 · Palco</div>
    <div class="lyrics">
      <div id="lyricNow"><span class="hi">One, two</span></div>
      <div id="lyricNext">Oh, life is bigger</div>
    </div>
    <div class="hint"><span>Luzes baixas. Toque abaixo do braço.</span></div>
    <div class="bottom">
      <button id="btnPlay" type="button">
        <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg id="iconPause" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="4" height="16"/><rect x="15" y="4" width="4" height="16"/></svg>
      </button>
      <div class="map"><canvas id="minimap"></canvas></div>
    </div>
  </div>
  <script>
    window.CD_THEME = {
      skyTop: "#1a1030", skyMid: "#120c22", skyBot: "#0b1220",
      seaTop: "#1a1008", seaMid: "#2a1808", seaBot: "#3b2410",
      boardTop: "#2a2218", boardBot: "#15110c",
      stringHi: "#e8dcc8", stringLo: "#c4a574",
      accent: "#ff9f1c", pause: "#7c3aed",
      boardY: 0.48, boardH: 0.15,
      font: "Outfit, sans-serif", displayFont: "Instrument Serif, serif"
    };
  </script>
  <script src="../js/engine.js"></script>
</body>
</html>
